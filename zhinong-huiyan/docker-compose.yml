version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: zhinong-postgres
    environment:
      POSTGRES_USER: zhinong
      POSTGRES_PASSWORD: zhinong123
      POSTGRES_DB: zhinong_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhinong -d zhinong_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: zhinong-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhinong-backend
    environment:
      - DATABASE_URL=postgresql://zhinong:zhinong123@postgres:5432/zhinong_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=zhinong-secret-key-2024
      - MODEL_PATH=/app/models
    volumes:
      - ./ai-model/models:/app/models:ro
      - ./ai-model/data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhinong-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

volumes:
  postgres_data:
  redis_data: